<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CONTROL HD NEFRO</title>

<style>
:root{
  --vino:#6f1835;
  --vino-claro:#8d2a4b;
  --fondo:#f7f5f5;
  --gris:#666;
  --borde:#e3dddd;
  --verde:#28734a;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--fondo);
  color:#222;
}

button,
input,
textarea{
  font:inherit;
}

header{
  background:var(--vino);
  color:white;
  padding:18px 16px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:22px;
  letter-spacing:.5px;
}

header p{
  margin:5px 0 0;
  font-size:13px;
  opacity:.9;
}

.container{
  width:100%;
  max-width:900px;
  margin:auto;
  padding:18px 14px 40px;
}

.section-title{
  color:var(--vino);
  font-size:20px;
  font-weight:bold;
  margin:4px 0 14px;
}

.search-row{
  display:flex;
  gap:8px;
  margin-bottom:16px;
}

.search-row input{
  flex:1;
  min-width:0;
  padding:13px 14px;
  border:1px solid var(--borde);
  border-radius:10px;
  background:white;
  outline:none;
}

.search-row input:focus{
  border-color:var(--vino);
}

.search-row button{
  border:0;
  border-radius:10px;
  padding:0 17px;
  background:var(--vino);
  color:white;
  cursor:pointer;
}

.patient-list{
  display:grid;
  grid-template-columns:1fr;
  gap:12px;
}

.patient-card{
  background:white;
  border:1px solid var(--borde);
  border-left:5px solid var(--vino);
  border-radius:12px;
  padding:16px;
  cursor:pointer;
  transition:.15s;
}

.patient-card:hover{
  transform:translateY(-1px);
}

.patient-name{
  font-size:18px;
  font-weight:bold;
  color:var(--vino);
  margin-bottom:6px;
}

.patient-info{
  font-size:14px;
  color:#555;
  line-height:1.5;
}

.no-results{
  background:white;
  border:1px solid var(--borde);
  border-radius:12px;
  padding:20px;
  text-align:center;
  color:#777;
}

.hidden{
  display:none !important;
}

.back-btn{
  border:0;
  background:transparent;
  color:var(--vino);
  font-weight:bold;
  padding:0;
  margin-bottom:12px;
  cursor:pointer;
}

.patient-header{
  background:white;
  border-radius:12px;
  border:1px solid var(--borde);
  padding:16px;
  margin-bottom:14px;
}

.patient-header h2{
  margin:0 0 7px;
  color:var(--vino);
  font-size:21px;
}

.patient-header p{
  margin:4px 0;
  font-size:14px;
  color:#555;
}

.card{
  background:white;
  border:1px solid var(--borde);
  border-radius:12px;
  padding:16px;
  margin-bottom:14px;
}

.card h3{
  margin:0 0 14px;
  color:var(--vino);
  font-size:17px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.field.full{
  grid-column:1 / -1;
}

.field label{
  font-size:12px;
  font-weight:bold;
  color:#555;
}

.field input,
.field textarea,
.field select{
  width:100%;
  padding:11px 10px;
  border:1px solid var(--borde);
  border-radius:8px;
  background:#fff;
  outline:none;
}

.field input:focus,
.field textarea:focus{
  border-color:var(--vino);
}

textarea{
  resize:vertical;
  min-height:75px;
}

.calc-box{
  background:#faf7f8;
  border:1px solid #eadde2;
  border-radius:10px;
  padding:12px;
  margin-top:12px;
}

.calc-row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:7px 0;
  border-bottom:1px solid #eee;
  font-size:14px;
}

.calc-row:last-child{
  border-bottom:0;
}

.calc-label{
  color:#555;
}

.calc-value{
  font-weight:bold;
  color:var(--vino);
  text-align:right;
}

.primary-btn{
  width:100%;
  border:0;
  border-radius:9px;
  padding:13px;
  background:var(--vino);
  color:white;
  font-weight:bold;
  cursor:pointer;
  margin-top:12px;
}

.secondary-btn{
  border:1px solid var(--vino);
  border-radius:8px;
  padding:9px 12px;
  background:white;
  color:var(--vino);
  cursor:pointer;
  font-weight:bold;
}

.danger-btn{
  border:0;
  border-radius:8px;
  padding:7px 10px;
  background:#f1e6e9;
  color:#8a173c;
  cursor:pointer;
}

.session-summary{
  background:#faf7f8;
  border-left:4px solid var(--vino);
  border-radius:8px;
  padding:12px;
}

.session-summary p{
  margin:5px 0;
  font-size:14px;
}

.session-summary strong{
  color:var(--vino);
}

.table-wrap{
  overflow-x:auto;
  width:100%;
}

table{
  width:100%;
  min-width:900px;
  border-collapse:collapse;
  font-size:12px;
}

th,
td{
  border-bottom:1px solid var(--borde);
  padding:9px 7px;
  text-align:left;
  vertical-align:top;
}

th{
  color:white;
  background:var(--vino);
  position:sticky;
  top:0;
}

.pending-item{
  display:flex;
  align-items:center;
  gap:8px;
  padding:9px 0;
  border-bottom:1px solid #eee;
}

.pending-item:last-child{
  border-bottom:0;
}

.pending-item span{
  flex:1;
  font-size:14px;
}

.pending-item.done span{
  text-decoration:line-through;
  color:#888;
}

.add-pending{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.add-pending input{
  flex:1;
  min-width:0;
  padding:10px;
  border:1px solid var(--borde);
  border-radius:8px;
}

.small-note{
  font-size:12px;
  color:#777;
  margin-top:8px;
}

.med-row,
.lab-row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:9px 0;
  border-bottom:1px solid #eee;
  font-size:14px;
}

.med-row:last-child,
.lab-row:last-child{
  border-bottom:0;
}

.ktv-result{
  margin-top:12px;
  padding:13px;
  background:#faf7f8;
  border-radius:9px;
  font-weight:bold;
  color:var(--vino);
}

.alert{
  padding:10px 12px;
  border-radius:8px;
  margin-top:10px;
  font-size:13px;
  background:#f7eeee;
  color:#7a263e;
}

@media(max-width:600px){
  .grid{
    grid-template-columns:1fr;
  }

  .field.full{
    grid-column:auto;
  }

  .search-row button{
    padding:0 13px;
  }

  .container{
    padding-left:11px;
    padding-right:11px;
  }
}
</style>
</head>

<body>

<header>
  <h1>CONTROL HD NEFRO</h1>
  <p>Control y seguimiento de pacientes en hemodiálisis</p>
</header>

<main class="container">

  <!-- LISTA DE PACIENTES -->
  <section id="patientsScreen">

    <div class="section-title">PACIENTES</div>

    <form id="searchForm" class="search-row">
      <input
        id="searchInput"
        type="search"
        placeholder="Buscar paciente..."
        autocomplete="off"
      >
      <button type="submit">Buscar</button>
